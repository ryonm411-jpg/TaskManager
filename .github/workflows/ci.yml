name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: taskmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 1. Download dependencies first so tooling is available
      - name: Install dependencies
        run: npm ci

      # 2. Build the shared package next so api can resolve its types
      - name: Build shared package
        run: npm run build --workspace=packages/shared

      # 3. Code quality inspections
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # 4. Database migrations & schemas
      - name: Initialize database schema
        run: PGPASSWORD=password psql -h localhost -U postgres -d taskmanager_test -f schema.sql

      # 5. Execute automated test suites
      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: taskmanager_test

      - name: Run integration tests
        run: npm run test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: taskmanager_test

      # 6. Verify final production bundlers compile cleanly
      - name: Build all packages
        run: npm run build

      # 7. Upload report even if prior test stages failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: packages/api/coverage/
