services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskmanager_dev
    ports:
      - "5432:5432"
    volumes:
      # Named volume: data survives docker-compose down / up restarts
      - postgres_data:/var/lib/postgresql/data
      # Auto-runs schema.sql the very first time this container starts
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
